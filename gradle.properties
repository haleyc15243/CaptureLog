#Gradle
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Configuration cache (try this - can significantly speed up builds)
org.gradle.configuration-cache=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#MPP
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.multiplatform=true

#Development
development=true

# Kotlinx DateTime experimental opt-ins
kotlin.optIns=kotlin.time.ExperimentalTime

kotlin.version=2.2.21